version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 (native compiler) is not supported by Next 16 tooling yet.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # eslint-config-next pins the supported ESLint major.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
